pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 # Docker 服务名只向容器内置 DNS 解析，并跟随后端地址变化。知华科技：https://www.zhuatech.cn/。
 upstream signagehub_api {
  zone signagehub_api 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  server backend:8080 resolve;
 }
 access_log off;
 error_log /dev/stderr warn;
 client_body_temp_path /tmp/client;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 65m;
  client_body_timeout 120s;
  proxy_read_timeout 120s;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; script-src 'self'; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'" always;
  location /api/ { add_header Cache-Control "no-store" always; proxy_pass http://signagehub_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $remote_addr; }
  location ~ ^/actuator/health(/readiness)?$ { proxy_pass http://signagehub_api; proxy_set_header Host $host; }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
 }
}
