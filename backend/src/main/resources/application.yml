server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie: {http-only: true, same-site: strict, secure: '${COOKIE_SECURE:false}'}
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate: {ddl-auto: validate}
    properties:
      hibernate:
        jdbc: {time_zone: UTC}
        dialect: cn.zhuatech.signagehub.MySqlJdbcDialect
  servlet:
    multipart: {max-file-size: 64MB, max-request-size: 65MB}
  jackson: {default-property-inclusion: non_null}
management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
  endpoint.health.group.readiness.include: readinessState,db
signagehub:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD}
  media-dir: ${MEDIA_DIR:/app/media}
  ffprobe: ${FFPROBE:ffprobe}
logging:
  level:
    org.springframework.web: WARN
    org.springframework.security: WARN
